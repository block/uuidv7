[package]
name = "block-uuidv7"
version = "0.1.0"
edition = "2024"
authors = ["Block, Inc."]
license = "Apache-2.0"
description = "High-performance UUID v7 generation with optional monotonic ordering"
repository = "https://github.com/block/uuidv7"
keywords = ["uuid", "uuid7", "identifier", "unique"]
categories = ["data-structures"]
readme = "README.md"

[dependencies]
rand = "0.9"
getrandom = "0.3"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "benchmarks"
harness = false
