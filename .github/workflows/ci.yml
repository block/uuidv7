name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x java/gradlew
    
    - name: Build with Gradle
      run: ./gradlew build
      working-directory: java

    - name: Run tests
      run: ./gradlew test
      working-directory: java

    - name: Run checks
      run: ./gradlew check
      working-directory: java

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
      working-directory: javascript
    
    - name: Type check
      run: npm run typecheck
      working-directory: javascript
    
    - name: Build
      run: npm run build
      working-directory: javascript
    
    - name: Run tests
      run: npm test
      working-directory: javascript

  ruby:
    name: Ruby
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ruby
    
    - name: Run tests
      run: bundle exec rake spec
      working-directory: ruby
    
    - name: Run linter
      run: bundle exec rake rubocop
      working-directory: ruby

  swift:
    name: Swift
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    
    - name: Build
      run: swift build
      working-directory: swift
    
    - name: Run tests
      run: swift test
      working-directory: swift

  rust:
    name: Rust
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    
    - name: Build
      run: cargo build
      working-directory: rust
    
    - name: Run tests
      run: cargo test
      working-directory: rust
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
      working-directory: rust
